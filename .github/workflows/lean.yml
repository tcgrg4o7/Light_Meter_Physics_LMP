name: Lean companions
on:
  push:
    branches: [main]
    paths:
      - 'papers/**/lean/**'
      - 'scripts/**'
      - '.github/workflows/lean.yml'
      - 'LEAN.md'
  pull_request:
    paths:
      - 'papers/**/lean/**'
      - 'scripts/**'
      - '.github/workflows/lean.yml'
      - 'LEAN.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: All registered Lean companions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore pinned toolchain and shared dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            .lean-cache/packages
          key: lean-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('papers/**/lean/lean-toolchain', 'papers/**/lean/lake-manifest.json') }}
      - name: Install Elan if missing
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x "$HOME/.elan/bin/elan" ]]; then
            temp="$(mktemp -d)"
            curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
              https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz \
              -o "$temp/elan.tar.gz"
            echo "f81c2e48c1588d4612cd2c8851947898a45ac8d72748a07dff3a5694f1cf589b  $temp/elan.tar.gz" | sha256sum --check
            tar -xzf "$temp/elan.tar.gz" -C "$temp"
            "$temp/elan-init" -y --default-toolchain none
            rm -rf "$temp"
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Provision shared pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare-lean-cache.py
          cd papers/04-compton-frequency/lean
          lake exe cache get
      - name: Build and audit every companion
        run: bash scripts/check-lean.sh
